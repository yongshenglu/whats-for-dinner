<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="家庭点菜小工具：把会做的菜录进去，每天随机生成今天吃什么">
<meta name="theme-color" content="#e8590c">
<title>今天吃什么？</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">

<header class="site-header">
  <h1>🍚 今天吃什么？</h1>
  <p class="subtitle">会做的菜都在这儿，别纠结，点一下</p>
</header>

<nav class="tabbar">
  <a class="tab active" href="index.html" aria-current="page"><span class="tab-icon">🎲</span><span class="tab-label">点菜</span></a>
  <a class="tab" href="history.html"><span class="tab-icon">📅</span><span class="tab-label">记录</span></a>
  <a class="tab" href="dishes.html"><span class="tab-icon">📖</span><span class="tab-label">菜谱</span></a>
  <a class="tab" href="backup.html"><span class="tab-icon">💾</span><span class="tab-label">备份</span></a>
</nav>

<main>

  <!-- 随机点菜 -->
  <section class="card">
    <div class="settings">
      <div class="settings-grid" id="steppers">
        <div class="stepper" data-cat="hun">
          <span class="stepper-label">🍗 荤菜</span>
          <div class="step-ctrl">
            <button class="step-btn" type="button" data-dir="-1" aria-label="荤菜减一">−</button>
            <span class="step-num">1</span>
            <button class="step-btn" type="button" data-dir="1" aria-label="荤菜加一">＋</button>
          </div>
        </div>
        <div class="stepper" data-cat="su">
          <span class="stepper-label">🥬 素菜</span>
          <div class="step-ctrl">
            <button class="step-btn" type="button" data-dir="-1" aria-label="素菜减一">−</button>
            <span class="step-num">1</span>
            <button class="step-btn" type="button" data-dir="1" aria-label="素菜加一">＋</button>
          </div>
        </div>
        <div class="stepper" data-cat="tang">
          <span class="stepper-label">🍲 汤</span>
          <div class="step-ctrl">
            <button class="step-btn" type="button" data-dir="-1" aria-label="汤减一">−</button>
            <span class="step-num">1</span>
            <button class="step-btn" type="button" data-dir="1" aria-label="汤加一">＋</button>
          </div>
        </div>
        <div class="stepper" data-cat="zhushi">
          <span class="stepper-label">🍚 主食</span>
          <div class="step-ctrl">
            <button class="step-btn" type="button" data-dir="-1" aria-label="主食减一">−</button>
            <span class="step-num">0</span>
            <button class="step-btn" type="button" data-dir="1" aria-label="主食加一">＋</button>
          </div>
        </div>
      </div>
      <div class="days-row">
        <label for="no-repeat-days">🔁 防重复</label>
        <input type="number" id="no-repeat-days" min="0" max="30" step="1" value="7">
        <span>天内吃过的优先不再出现</span>
      </div>
    </div>

    <button id="btn-generate" class="btn btn-primary btn-big">🎲 帮我决定</button>

    <div id="result" class="result hidden"></div>
  </section>

</main>

<footer class="site-footer">数据只存在本设备浏览器里 · 记得偶尔导出备份</footer>

<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
